[package]
name = "hoonarqube-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[lib]
path = "src/lib.rs"

[[bin]]
name = "hoonarqube-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tokio"] }
hex = "0.4.3"
hoonarqube-catalog = { version = "0.8.1", path = "../hoonarqube-catalog" }
hoonarqube-core = { version = "0.8.1", path = "../hoonarqube-core" }
hoonarqube-ir = { version = "0.8.1", path = "../hoonarqube-ir" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
