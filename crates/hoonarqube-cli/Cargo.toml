[package]
name = "hoonarqube-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hoonarqube"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
hoonarqube-catalog = { version = "0.2.0", path = "../hoonarqube-catalog" }
hoonarqube-core = { version = "0.2.0", path = "../hoonarqube-core" }
hoonarqube-ir = { version = "0.2.0", path = "../hoonarqube-ir" }
ignore = "0.4.33"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[lints]
workspace = true
