name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview Hooversion without release commits, tags, releases, or assets
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HOOVERSION_VERSION: 1.0.3

jobs:
  release:
    name: Hooversion release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Release
        id: release
        uses: openhoo/hooversion/actions/release@4aa43b4d775c7b03d196b06381013f4601467c57 # v1.0.3
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  artifacts:
    name: Publish Linux binary
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Verify and build release binary
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_VERSION"
          python3 scripts/sync_release_version.py --check
          cargo test --locked -p hoonarqube-cli
          cargo build --locked --release -p hoonarqube-cli
          target/release/hoonarqube --version | grep -Fx "hoonarqube $RELEASE_VERSION"

      - name: Package archive and checksum
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          package="hoonarqube-${RELEASE_VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          install -m 0755 target/release/hoonarqube "dist/$package/hoonarqube"
          install -m 0644 LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          sha256sum "dist/$package.tar.gz" | sed 's#dist/##' > dist/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/*.sigstore.json
          --clobber
