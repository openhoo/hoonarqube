name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview Hooversion without release commits, tags, releases, or assets
        type: boolean
        default: true
      tag:
        description: Rebuild assets for an existing stable release tag
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HOOVERSION_VERSION: 1.1.1

jobs:
  release:
    name: Hooversion release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.finalize.outputs.published }}
      tag: ${{ steps.finalize.outputs.tag }}
      version: ${{ steps.finalize.outputs.version }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare protected-branch release
        if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        uses: openhoo/hooversion/actions/prepare-release@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Finalize protected-branch release
        id: finalize
        if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        uses: openhoo/hooversion/actions/release@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  artifacts:
    name: Publish Linux binary
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Verify and build release binary
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_VERSION"
          python3 scripts/sync_release_version.py --check
          cargo test --locked -p hoonarqube-cli
          cargo build --locked --release -p hoonarqube-cli
          target/release/hoonarqube --version | grep -Fx "hoonarqube $RELEASE_VERSION"

      - name: Package archive
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          package="hoonarqube-${RELEASE_VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          install -m 0755 target/release/hoonarqube "dist/$package/hoonarqube"
          install -m 0644 LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/hoonarqube_${{ needs.release.outputs.tag }}.spdx.json
          artifact-name: hoonarqube-sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.spdx.json | sort -k2 > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/*.tar.gz
          dist/*.spdx.json
          dist/SHA256SUMS
          dist/*.sigstore.json
          --clobber

  rebuild-assets:
    name: Rebuild release assets
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      REBUILD_TAG: ${{ inputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Validate rebuild tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REBUILD_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::rebuild tag must be a stable semantic version prefixed with v." >&2
            exit 2
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.REBUILD_TAG }}

      - name: Read and verify release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${REBUILD_TAG#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse --verify "refs/tags/${REBUILD_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          test "$tag_commit" = "$head_commit"
          subject="$(git log -1 --format=%s HEAD)"
          prefix="chore(release): hoonarqube ${version}"
          if [[ "$subject" != "$prefix" ]]; then
            suffix="${subject#"$prefix"}"
            if [[ "$subject" != "$prefix "* || ! "$suffix" =~ ^\ \(#[1-9][0-9]*\)$ ]]; then
              echo "::error::tag must identify a Hoonarqube release commit." >&2
              exit 1
            fi
          fi
          git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main
          gh release view "$REBUILD_TAG" >/dev/null
          {
            echo "version=$version"
            echo "tag=$REBUILD_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify and build release binary
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_release_version.py --check
          cargo test --locked -p hoonarqube-cli
          cargo build --locked --release -p hoonarqube-cli
          target/release/hoonarqube --version | grep -Fx "hoonarqube $RELEASE_VERSION"

      - name: Package archive
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          package="hoonarqube-${RELEASE_VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package"
          install -m 0755 target/release/hoonarqube "dist/$package/hoonarqube"
          install -m 0644 LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/hoonarqube_${{ steps.meta.outputs.tag }}.spdx.json
          artifact-name: hoonarqube-sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.spdx.json | sort -k2 > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/*.tar.gz
          dist/*.spdx.json
          dist/SHA256SUMS
          dist/*.sigstore.json
          --clobber
