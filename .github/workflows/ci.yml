name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Frozen catalog integrity
        run: cargo run -q -p xtask -- catalog audit --require-pages-complete

      - name: Actionable rule coverage
        run: cargo run -q -p xtask -- catalog coverage --strict --allow-infra

      - name: Oracle harness tests
        run: python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v
