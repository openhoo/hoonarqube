name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.0.6

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@528576f6fbc6136ec5f76ac53bf81d3e04aca4b3 # v1.0.6
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  dependency-policy:
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"

  quality:
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust format
        run: cargo fmt --all --check

      - name: Release version synchronization
        run: |
          python3 scripts/sync_release_version.py --check
          python3 -m unittest scripts/test_sync_release_version.py

      - name: Source-only publication policy
        run: |
          cargo metadata --locked --format-version 1 --no-deps |
            jq -e 'all(.packages[]; .publish == [])'

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Rust tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Self-analysis complexity
        run: |
          cargo run --locked -q -p hoonarqube-cli -- --json analyze crates xtask |
            jq -e '[.files[].issues[] | select(.rule_key == "rust:S3776")] | length == 0'

      - name: Dogfood Hoonarqube action
        uses: ./actions/analyze
        with:
          executable: ./target/debug/hoonarqube
          paths: |
            crates
            xtask
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@f1b9be32483e3353e38ef3b5703217d2723e735e # v0.2.4
        with:
          version: 0.2.4

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@5446c51a79d115048601d3f42d6a9127b49fb322 # v0.6.3
        with:
          version: 0.6.3
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@4a833fd00dafc8fb017d5cabec0c38dddba4bc70 # v0.1.1
        with:
          version: 0.1.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Frozen catalog integrity
        run: cargo run --locked -q -p xtask -- catalog audit --require-pages-complete

      - name: Actionable rule coverage
        run: cargo run --locked -q -p xtask -- catalog coverage --strict --allow-infra

      - name: Oracle harness tests
        run: python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v

      - name: Oracle harness syntax
        run: python3 -m compileall -q -x 'tools/oracle/fixtures/' tools/oracle

      - name: Oracle harness lint
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.20
          ruff check tools/oracle --exclude tools/oracle/fixtures \
            --extend-select C90,PLR0911,PLR0912,PLR0915,PERF,SIM,B
          ruff format --check tools/oracle --exclude tools/oracle/fixtures
