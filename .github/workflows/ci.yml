name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.0.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@4aa43b4d775c7b03d196b06381013f4601467c57 # v1.0.3
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  dependency-policy:
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.96.0"

  quality:
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust format
        run: cargo fmt --all --check

      - name: Release version synchronization
        run: |
          python3 scripts/sync_release_version.py --check
          python3 -m unittest scripts/test_sync_release_version.py

      - name: Source-only publication policy
        run: |
          cargo metadata --locked --format-version 1 --no-deps |
            jq -e 'all(.packages[]; .publish == [])'

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Rust tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Self-analysis complexity
        run: |
          cargo run --locked -q -p hoonarqube-cli -- --json analyze crates xtask |
            jq -e '[.files[].issues[] | select(.rule_key == "rust:S3776")] | length == 0'

      - name: Dogfood Hoonarqube action
        uses: ./actions/analyze
        with:
          executable: ./target/debug/hoonarqube
          paths: |
            crates
            xtask
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@584ed5abf673dfb9b1d5279dfaa78329a94a9ea5 # v0.2.3
        with:
          version: 0.2.3

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@d06c0948b4747995e2ef755cb6260d07f75c1b14 # v0.6.2
        with:
          version: 0.6.2
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Frozen catalog integrity
        run: cargo run --locked -q -p xtask -- catalog audit --require-pages-complete

      - name: Actionable rule coverage
        run: cargo run --locked -q -p xtask -- catalog coverage --strict --allow-infra

      - name: Oracle harness tests
        run: python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v

      - name: Oracle harness syntax
        run: python3 -m compileall -q -x 'tools/oracle/fixtures/' tools/oracle

      - name: Oracle harness lint
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.20
          ruff check tools/oracle --exclude tools/oracle/fixtures \
            --extend-select C90,PLR0911,PLR0912,PLR0915,PERF,SIM,B
          ruff format --check tools/oracle --exclude tools/oracle/fixtures
