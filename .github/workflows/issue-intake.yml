name: Issue intake

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      mode:
        description: Triage one issue or verify Jev on synthetic fixtures
        type: choice
        options: [triage, verify]
        default: triage
      issue_number:
        description: Open issue number to triage
        required: false
        type: string

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: issue-intake-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate issue intake
    if: >-
      github.repository == 'openhoo/hoonarqube' &&
      github.ref == 'refs/heads/main' &&
      !github.event.issue.pull_request &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply conservative intake labels
        if: github.event_name == 'issues'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const intake = require('./.github/scripts/issue-intake.cjs');
            await intake.run({ github, context, core });

      - name: Connect this trusted workflow to the Cube triage service
        if: vars.HOONARQUBE_JEV_TRIAGE_ENABLED == 'true' || inputs.mode == 'verify'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.HOONARQUBE_CUBE_CLIENT_ID }}
          audience: ${{ vars.HOONARQUBE_CUBE_AUDIENCE }}
          tags: tag:hoonarqube-triage
          version: 1.102.4

      - name: Triage report content with Jev
        if: inputs.mode != 'verify'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HOONARQUBE_JEV_KEY: ${{ secrets.HOONARQUBE_JEV_KEY }}
          HOONARQUBE_JEV_TRIAGE_ENABLED: ${{ vars.HOONARQUBE_JEV_TRIAGE_ENABLED }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 0
          script: |
            const triage = require('./.github/scripts/issue-jev-triage.cjs');
            const sourceSha = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const result = await triage.run({ github, context: { ...context, repo: context.repo, sha: sourceSha }, core });
            if (result.skipped) core.info(`Jev intake skipped: ${result.reason}`);

      - name: Verify the production Jev connection with synthetic reports
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        env:
          HOONARQUBE_JEV_KEY: ${{ secrets.HOONARQUBE_JEV_KEY }}
        run: printf '%s' "$HOONARQUBE_JEV_KEY" | node .github/scripts/evaluate-jev-triage.cjs
