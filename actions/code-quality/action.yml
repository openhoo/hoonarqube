name: Hoonarqube Code Quality SARIF
description: Analyze with Hoonarqube's Code Quality profile and optionally upload SARIF to GitHub code scanning.
inputs:
  version:
    description: Hoonarqube release version to install.
    required: false
    default: "0.3.1"
  executable:
    description: Optional Hoonarqube executable path; skips release installation when set.
    required: false
    default: ""
  working-directory:
    description: Repository directory where Hoonarqube should run.
    required: false
    default: "."
  paths:
    description: Newline-separated source paths to analyze.
    required: true
  output:
    description: SARIF report path, relative to working-directory unless absolute.
    required: false
    default: "hoonarqube.sarif"
  upload:
    description: Upload the validated SARIF report to GitHub code scanning when true.
    required: false
    default: "false"
  fail-on:
    description: "Minimum SARIF severity that fails the action: none, findings, note, warning, or error."
    required: false
    default: "none"
outputs:
  report:
    description: Absolute path to the validated SARIF report.
    value: ${{ steps.analyze.outputs.report }}
  result-count:
    description: Number of SARIF results in the report.
    value: ${{ steps.analyze.outputs.result-count }}
  blocking-findings:
    description: Number of SARIF results at or above the fail-on threshold.
    value: ${{ steps.analyze.outputs.blocking-findings }}
runs:
  using: composite
  steps:
    - name: Install pinned Cosign verifier
      if: ${{ inputs.executable == '' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Set up Hoonarqube
      if: ${{ inputs.executable == '' }}
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS_VALUE: ${{ runner.os }}
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/../setup/install.sh"

    - name: Analyze source and write SARIF
      id: analyze
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_EXECUTABLE: ${{ inputs.executable }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_UPLOAD: ${{ inputs.upload }}
      run: |
        set -euo pipefail

        hoonarqube_command=(hoonarqube)
        if [[ -n "$INPUT_EXECUTABLE" ]]; then
          hoonarqube_command=("$INPUT_EXECUTABLE")
        fi

        if [[ -z "$INPUT_OUTPUT" ]]; then
          echo "::error::output must name a report file."
          exit 2
        fi
        if [[ "$INPUT_OUTPUT" == *$'\n'* || "$INPUT_OUTPUT" == *$'\r'* ]]; then
          echo "::error::output must be a single-line report path."
          exit 2
        fi
        case "$INPUT_UPLOAD" in
          true|false) ;;
          *)
            echo "::error::upload must be true or false."
            exit 2
            ;;
        esac
        fail_on="${INPUT_FAIL_ON,,}"
        case "$fail_on" in
          none|findings|note|warning|error) ;;
          *)
            echo "::error::fail-on must be none, findings, note, warning, or error."
            exit 2
            ;;
        esac

        paths=()
        while IFS= read -r path || [[ -n "$path" ]]; do
          if [[ "$path" == *$'\r' ]]; then
            path="${path%$'\r'}"
          fi
          [[ "$path" =~ ^[[:space:]]*$ ]] && continue
          paths+=("$path")
        done <<< "$INPUT_PATHS"

        report_path="$INPUT_OUTPUT"
        if [[ "$report_path" != /* ]]; then
          report_path="$PWD/$report_path"
        fi
        mkdir -p -- "$(dirname -- "$report_path")"

        temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        mkdir -p -- "$temp_root"
        temporary_report="$(mktemp "$temp_root/hoonarqube-code-quality.XXXXXX.sarif")"
        trap 'rm -f -- "$temporary_report"' EXIT

        if ! "${hoonarqube_command[@]}" analyze --profile github-code-quality --format sarif -- "${paths[@]}" > "$temporary_report"; then
          echo "::error::Hoonarqube analysis failed; no SARIF report was published."
          exit 1
        fi

        if ! jq -e '
          def positive_integer:
            type == "number" and . >= 1 and floor == .;
          def nonnegative_integer:
            type == "number" and . >= 0 and floor == .;
          def uri:
            type == "string" and length > 0;
          def region:
            type == "object"
            and (.startLine | positive_integer)
            and (.startColumn | positive_integer)
            and (.endLine | positive_integer)
            and (.endColumn | positive_integer)
            and (.startLine <= .endLine)
            and ((.startLine < .endLine) or (.startColumn <= .endColumn));
          def location:
            type == "object"
            and (.physicalLocation | type == "object")
            and (.physicalLocation.artifactLocation.uri | uri)
            and (
              (.physicalLocation | has("region") | not)
              or (.physicalLocation.region | region)
            );
          . as $sarif
          | ($sarif | type == "object")
          and ($sarif["$schema"] == "https://json.schemastore.org/sarif-2.1.0.json")
          and ($sarif.version == "2.1.0")
          and ($sarif.runs | type == "array" and length == 1)
          and ($sarif.runs[0].tool.driver.name == "Hoonarqube")
          and ($sarif.runs[0].tool.driver.rules | type == "array")
          and (
            ([$sarif.runs[0].tool.driver.rules[].id] | unique | length)
            == ([$sarif.runs[0].tool.driver.rules[].id] | length)
          )
          and all($sarif.runs[0].tool.driver.rules[];
            (type == "object")
            and (.id | type == "string" and length > 0)
            and (.name | type == "string")
            and (.shortDescription.text | type == "string")
            and (.helpUri | uri)
            and (.properties | type == "object")
            and (.properties.category | type == "string")
            and (.properties.severity | type == "string")
            and (.properties.help | uri)
          )
          and ($sarif.runs[0].results | type == "array")
          and all($sarif.runs[0].results[];
            (type == "object")
            and (.ruleId | type == "string" and length > 0)
            and (.ruleIndex | nonnegative_integer)
            and (.level | type == "string" and (. == "error" or . == "warning" or . == "note"))
            and (.message.text | type == "string")
            and (.locations | type == "array" and length >= 1)
            and all(.locations[]; location)
            and (
              (has("relatedLocations") | not)
              or (.relatedLocations | type == "array")
            )
            and all(.relatedLocations[]?;
              (.id | nonnegative_integer)
              and location
            )
            and (
              (has("codeFlows") | not)
              or (.codeFlows | type == "array")
            )
            and all(.codeFlows[]?;
              (.threadFlows | type == "array" and length >= 1)
              and all(.threadFlows[];
                (.locations | type == "array" and length >= 1)
                and all(.locations[]; (.location | location))
              )
            )
          )
          and all($sarif.runs[0].results[];
            .ruleIndex < ($sarif.runs[0].tool.driver.rules | length)
            and $sarif.runs[0].tool.driver.rules[.ruleIndex].id == .ruleId
          )
        ' "$temporary_report" >/dev/null
        then
          echo "::error::generated report failed SARIF validation; no report was published."
          exit 1
        fi
        mv -- "$temporary_report" "$report_path"

        result_count="$(jq -er '.runs[0].results | length' "$report_path")"
        blocking_count="$(jq -er --arg fail_on "$fail_on" '
          ($fail_on | if . == "none" then 99
            elif . == "error" then 3
            elif . == "warning" then 2
            else 1
            end) as $minimum
          | [.runs[0].results[]
             | select($minimum < 99
                 and (if .level == "error" then 3
                      elif .level == "warning" then 2
                      else 1
                      end) >= $minimum)]
          | length
        ' "$report_path")"
        {
          echo "report=$report_path"
          echo "result-count=$result_count"
          echo "blocking-findings=$blocking_count"
          echo "checkout-path=$PWD"
        } >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub code scanning
      if: ${{ inputs.upload == 'true' && success() }}
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      with:
        sarif_file: ${{ steps.analyze.outputs.report }}
        checkout_path: ${{ steps.analyze.outputs.checkout-path }}

    - name: Enforce finding threshold
      shell: bash
      env:
        BLOCKING_FINDINGS: ${{ steps.analyze.outputs.blocking-findings }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [[ "$BLOCKING_FINDINGS" -ne 0 ]]; then
          echo "::error::Hoonarqube found ${BLOCKING_FINDINGS} SARIF result(s) at or above ${FAIL_ON,,}."
          exit 1
        fi
