[workspace]
members = [
    "crates/hoonarqube",
    "crates/hoonarqube-cli",
    "crates/hoonarqube-core",
    "crates/hoonarqube-catalog",
    "crates/hoonarqube-ir",
    "crates/hoonarqube-dataflow",
    "crates/hoonarqube-csharp",
    "crates/hoonarqube-jsts",
    "crates/hoonarqube-java",
    "crates/hoonarqube-python",
    "crates/hoonarqube-ruby",
    "crates/hoonarqube-go",
    "crates/hoonarqube-rust",
    "crates/hoonarqube-bench",
    "crates/hoonarqube-service",
    "xtask",
]
exclude = [
    "vendor/tree-sitter-typescript",
    "vendor/tree-sitter-c-sharp",
    "vendor/tree-sitter-javascript",
    "vendor/oxc_parser-0.146.0",
]
resolver = "3"

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/openhoo/hoonarqube"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious_operation_groupings = "warn"

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
# Keep the exact 0.146.0 parser dependency while carrying the upstream EOF
# finalization fix required by malformed-source token collection.
oxc_parser = { path = "vendor/oxc_parser-0.146.0" }
