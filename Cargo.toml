[workspace]
members = [
    "crates/hoonarqube",
    "crates/hoonarqube-cli",
    "crates/hoonarqube-core",
    "crates/hoonarqube-catalog",
    "crates/hoonarqube-ir",
    "crates/hoonarqube-dataflow",
    "crates/hoonarqube-csharp",
    "crates/hoonarqube-jsts",
    "crates/hoonarqube-python",
    "crates/hoonarqube-bench",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/openhoo/hoonarqube"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
