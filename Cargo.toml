[workspace]
members = [
    "crates/hoonarqube",
    "crates/hoonarqube-cli",
    "crates/hoonarqube-core",
    "crates/hoonarqube-catalog",
    "crates/hoonarqube-ir",
    "crates/hoonarqube-dataflow",
    "crates/hoonarqube-csharp",
    "crates/hoonarqube-jsts",
    "crates/hoonarqube-java",
    "crates/hoonarqube-python",
    "crates/hoonarqube-ruby",
    "crates/hoonarqube-go",
    "crates/hoonarqube-rust",
    "crates/hoonarqube-bench",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/openhoo/hoonarqube"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious_operation_groupings = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
